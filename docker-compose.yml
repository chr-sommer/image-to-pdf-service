services:
  minio:
    image: minio/minio:latest
    container_name: local-s3
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/pdf-conversion-artifacts;
      exit 0;
      "

  pdf-converter:
    build: .
    container_name: image-to-pdf-service
    ports:
      - "8080:8080"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_S3_ENDPOINT: http://minio:9000
      APP_S3_PUBLIC_ENDPOINT: http://localhost:9000
      APP_S3_BUCKET_NAME: pdf-conversion-artifacts
      APP_S3_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin